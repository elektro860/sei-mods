[tips-and-tricks-item-description]
agriculture=[entity=agricultural-tower] ช่วยให้ปลูกเมล็ดพันธุ์ในดินที่ปลูกได้ เมล็ดพันธุ์ที่ปลูกจะเติบโตเป็นต้นไม้ที่เก็บเกี่ยวได้\n[entity=yumako-tree] เติบโตบน [tile=natural-yumako-soil] ให้ [item=yumako] ซึ่งมี [item=yumako-seed] สำหรับปลูกต้นไม้ใหม่\nขยายสวนได้โดยถม [tile=wetland-yumako] ใกล้เคียงด้วย [item=artificial-yumako-soil] พื้นที่เหล่านี้จะเป็นสีเหลืองบนแผนที่\n[entity=jellystem] เติบโตบน [tile=natural-jellynut-soil] ให้ [item=jellynut] ซึ่งมี [item=jellynut-seed] สำหรับปลูกต้นไม้ใหม่\nขยายสวนได้โดยถม [tile=wetland-jellynut] ใกล้เคียงด้วย [item=artificial-jellynut-soil] พื้นที่เหล่านี้จะเป็นสีม่วงแดงบนแผนที่
aquilo-briefing=[planet=aquilo] เป็นดินแดนรกร้างที่หนาวจัดมีมหาสมุทรแอมโมเนีย เป็นดาวเคราะห์ที่ไกลที่สุดที่การใช้ [entity=solar-panel] แทบเป็นไปไม่ได้\n[entity=logistic-robot] และ [entity=construction-robot] อ่อนแอกว่ามากที่นี่\nทรัพยากรที่คุ้นเคยเพียงอย่างเดียวที่นี่คือ [entity=crude-oil] ดังนั้นฐานจะต้องพึ่งพาระบบขนส่งระหว่างดาวเคราะห์ ผู้เล่นอาจติดอยู่หากขาดการส่งเสบียงจากดาวเคราะห์อื่น!\nพื้นผิวค่อนข้างเล็กและต้องขยาย มหาสมุทรถมได้ด้วย [item=ice-platform] เพื่อให้เดินได้ [item=concrete] ใช้เป็นฐานรากสำหรับอาคารและป้องกันน้ำแข็งละลาย\nสิ่งก่อสร้างต้องได้รับความร้อนเพื่อทำงานโดยใช้ [entity=heating-tower] และ [entity=heat-pipe]
asteroid-defense=[entity=gun-turret] ใช้ทำลายดาวเคราะห์น้อยขนาดใหญ่ให้เป็นชิ้นส่วน จากนั้น [entity=asteroid-collector] รับไปและแปรรูปบนแพลตฟอร์มเพื่อเอาทรัพยากร ดาวเคราะห์น้อยขนาดใหญ่ทำให้แพลตฟอร์มเสียหายเมื่อชน
fulgora-briefing=[planet=fulgora] เป็นดาวเคราะห์แห้งแล้งรกร้างที่ไม่มีสิ่งมีชีวิตและมีพายุฟ้าผ่าอันตรายในรอบกลางคืนที่เกิดบ่อย\n[entity=solar-panel] มีประสิทธิภาพน้อยกว่ามาก แต่ฟ้าผ่าสามารถรวบรวมได้โดย [entity=lightning-rod] และเก็บใน [entity=accumulator]\nไม่มีทรัพยากรธรรมชาติใด ๆ บนดาวเคราะห์ สิ่งเดียวที่มีคือของที่เหลือในรูปแบบ [entity=scrap]\nบริเวณที่เคยเป็นมหาสมุทรตอนนี้เต็มไปด้วย [fluid=heavy-oil] ซึ่งสูบได้ด้วย [entity=offshore-pump]\n[tile=oil-ocean-shallow] ถมไม่ได้จนกว่าจะถึงระยะต่อมา แต่ข้ามได้ด้วยรางยกระดับ การสร้าง [entity=rail-support] บนส่วนลึกของมหาสมุทรต้องวิจัยเพิ่มเติม
gleba-briefing=[planet=gleba] เป็นดาวเคราะห์หนองน้ำชื้นแฉะที่มีพืชพรรณแปลกตาอุดมสมบูรณ์ซึ่งปลูกได้ด้วย [entity=agricultural-tower] และแปรรูปใน [entity=biochamber]\nไม่พบ [entity=iron-ore] [entity=copper-ore] [entity=crude-oil] [entity=coal] และ [entity=uranium-ore] แต่พืชให้วิธีทางเลือกในการผลิตไอเท็มที่จำเป็น\nไอเท็มส่วนใหญ่จากการเกษตรมีความท้าทายเพิ่มเติม คือเน่าเสียได้ตามเวลา แม้แต่ [item=agricultural-science-pack] ก็มีอายุจำกัดและสะสมไม่ได้\nสิ่งมีชีวิต 5 ขาขนาดใหญ่เป็นสัตว์พื้นเมืองของดาวเคราะห์นี้ [entity=solar-panel] อ่อนแอลงแต่ยังใช้ได้
heating-mechanics=[entity=heating-tower] สร้างความร้อนจากเชื้อเพลิงและไม่หยุดเผาไหม้เมื่อถึงอุณหภูมิสูงสุด\nใช้ [entity=heat-pipe] ในการถ่ายเทความร้อนไปยังสิ่งก่อสร้างอื่น ๆ\nทุกสิ่งก่อสร้างต้องสัมผัสกับแหล่งความร้อนเพื่อไม่ให้แข็งตัว\nยกเว้นเสาไฟฟ้า [entity=solar-panel] และ [entity=accumulator]
lava-processing=[fluid=lava] สูบได้โดย [entity=offshore-pump] และแปรรูปใน [entity=foundry] ให้ได้ [item=stone] [fluid=molten-iron] และ [fluid=molten-copper]\nสามารถกำจัดไอเท็มที่ไม่ต้องการได้โดยเคลื่อนย้ายลงใน [tile=lava] โดยตรง
lightning-mechanics=[entity=lightning-rod] ป้องกันพื้นที่เล็ก ๆ จากฟ้าผ่าและแปลงพลังงานเข้าสู่เครือข่ายไฟฟ้า\nฟ้าผ่าสร้างพลังงานจำนวนมากในช่วงเวลาสั้น การมี [entity=accumulator] มากขึ้นจะช่วยใช้พลังงานจากฟ้าผ่าแต่ละครั้งได้ดีกว่า\nสามารถแทนที่ด้วย [entity=lightning-collector] ที่มีประสิทธิภาพกว่าได้ในภายหลัง
orbital-logistics=[entity=space-platform-hub] ร้องขอไอเท็มจากเครือข่ายระบบขนส่งเพื่อส่งมาด้วยจรวด สามารถร้องขอวัสดุก่อสร้างที่ขาดอยู่โดยอัตโนมัติ\n[entity=rocket-silo] ตั้งค่าให้เติมคำขอจากแพลตฟอร์มอวกาศโดยอัตโนมัติได้\n[entity=cargo-landing-pad] ร้องขอไอเท็มจากแพลตฟอร์มอวกาศที่โคจรอยู่ เว้นแต่ดาวเคราะห์นั้นกำลังร้องขอไอเท็มนั้นอยู่แล้ว\n__CONTROL__stack-transfer__ ใน GUI ฮับแพลตฟอร์มอวกาศโอนกองเดียวไปยังดาวเคราะห์ด้วยตนเอง ไอเท็มจะปรากฏใน [entity=cargo-pod-container] ที่พิกัดเริ่มต้น
production-entity-list=[entity=electric-mining-drill] สว่านขุดแร่ไฟฟ้า \n[entity=big-mining-drill] สว่านขุดแร่ขนาดใหญ่ \n[entity=pumpjack] ปั๊มสูบน้ำมัน \n[entity=assembling-machine-2] เครื่องประกอบ 2 \n[entity=assembling-machine-3] เครื่องประกอบ 3 \n[entity=electric-furnace] เตาหลอมไฟฟ้า \n[entity=recycler] เครื่องรีไซเคิล \n[entity=chemical-plant] โรงงานเคมี \n[entity=centrifuge] เครื่องเหวี่ยง \n[entity=crusher] เครื่องบด \n[entity=foundry] โรงหลอม \n[entity=agricultural-tower] หอเกษตร \n[entity=electromagnetic-plant] โรงงานแม่เหล็กไฟฟ้า \n[entity=cryogenic-plant] โรงงานไครโอเจนิก
removing-trash-in-space=[entity=inserter] ใช้กำจัดไอเท็มที่ไม่ต้องการได้โดยเคลื่อนย้ายออกสู่ห้วงอวกาศ
space-platform=แพลตฟอร์มอวกาศสร้างจากระยะไกล โดยส่งวัสดุก่อสร้างมาด้วยจรวด ใช้ขนส่งผู้เล่นและสินค้าระหว่างดาวเคราะห์\n\n- [item=space-platform-starter-pack] ใช้เริ่มต้นสถานี จากนั้นขยายด้วย [item=space-platform-foundation]\n- [entity=asteroid-collector] ดักจับดาวเคราะห์น้อยจากอวกาศเพื่อเป็นวัตถุดิบ\n- [entity=crusher] ใช้บดดาวเคราะห์น้อยเพื่อเอาทรัพยากร
space-science=ใน Space Age [item=space-science-pack] ผลิตได้เฉพาะบนแพลตฟอร์มอวกาศโดยใช้ชิ้นดาวเคราะห์น้อยที่แปรรูปแล้ว
spoilables=ไอเท็มที่มีคุณสมบัติเน่าเสียได้ [img=utility/tooltip_category_spoilable] มีอายุจำกัด เมื่อหมดเวลาไอเท็มจะเน่าเสียกลายเป็นไอเท็มอื่น เช่น [item=spoilage]\nไอเท็มที่มีคุณภาพสูงกว่าจะสดได้นานกว่า
spoilables-research=[item=agricultural-science-pack] ยิ่งเน่าเสียมากยิ่งให้คุณค่าน้อยลง
spoilables-result=ระดับการเน่าเสียของส่วนผสมส่งผลต่อระดับการเน่าเสียของผลผลิต
vulcanus-briefing=[planet=vulcanus] เป็นดาวเคราะห์ที่ร้อนจัดและไม่มี [fluid=water] ไม่พบ [entity=crude-oil] หรือ [entity=uranium-ore] แต่มี [tooltip=resources,tips-and-tricks-item-description.vulcanus-resources] ใหม่หลายอย่าง\n[fluid=lava] เป็นแหล่งแร่ธาตุไม่สิ้นสุดแทนแหล่ง [item=stone] [item=iron-ore] และ [item=copper-ore] ซึ่งพบในรูปแบบดิบได้เฉพาะใน [entity=big-rock]\n[entity=solar-panel] มีประสิทธิภาพสูงกว่ามาก สภาพแวดล้อมไม่เป็นมิตรด้วยภูเขาไฟสูงชัน แม่น้ำลาวา ที่ราบเถ้าถ่าน และน้ำพุกรดซัลฟิวริก\n[tile=lava] ถมไม่ได้จนกว่าจะถึงระยะต่อมา แต่ข้ามได้ด้วยรางยกระดับ
vulcanus-resources=ทรัพยากร Vulcanus:\n[entity=sulfuric-acid-geyser] น้ำพุกรดซัลฟิวริก \n[entity=calcite] แคลไซต์ \n[entity=tungsten-ore] แร่ทังสเตน
