[space-location-description]
aquilo=ดินแดนรกร้างที่หนาวจัดมีมหาสมุทรแอมโมเนียเหลวและช่องระบายฟลูออรีน โครงสร้างและสายพานจะแข็งตัวหากไม่มีความร้อนจากท่อความร้อนหรือโครงสร้างร้อนอื่น ๆ ใกล้เคียง
fulgora=ดาวเคราะห์แห้งแล้งที่ลมพัดแรง มีพายุฟ้าผ่าบนที่ราบสูง และมหาสมุทรน้ำมันที่ข้ามได้ด้วยรางยกระดับ\nดูเหมือนจะมีซากปรักหักพังบางส่วน
gleba=ดาวเคราะห์หนองน้ำชื้นแฉะที่มีบึงลึก เนินเขาคดเคี้ยว และที่ดินอุดมสมบูรณ์ อุดมสารอาหาร พื้นที่หนองน้ำถมได้ ที่สูงขัดขวางการสร้างทางรถไฟแต่จำเป็นสำหรับการเกษตร
shattered-planet=ซากลึกลับของโลกเก่าในห้วงลึกของอวกาศระหว่างดาว ซากที่ลอยอยู่ในอวกาศที่มันเคยครอบครองนั้นซ่อนทรัพยากรสำหรับปลดล็อกวิทยาการอันทรงพลัง อย่างไรก็ตามการเข้าถึงพวกมันนั้นไม่ปลอดภัย...
solar-system-edge=จุดสิ้นสุด! หรือจุดเริ่มต้นใหม่ การสร้างแพลตฟอร์มอวกาศที่สามารถอยู่รอดได้ไกลถึงที่นี่ เกินกว่าความปลอดภัยสัมพัทธ์ของจุดลงจอดครั้งแรก พิสูจน์ความสามารถในการเดินทางไปได้ทุกที่ในห้วงลึกของอวกาศระหว่างดาว แพลตฟอร์มอวกาศที่จะรอดชีวิตจากการเดินทางนี้ต้องพึ่งตัวเองได้อย่างมากและมีเครื่องมือในการแปลงดาวเคราะห์น้อยขนาดใหญ่ที่อันตรายระหว่างทางให้เป็นทรัพยากรที่ใช้ได้
vulcanus=ดาวเคราะห์ภูเขาไฟที่ร้อนจัด มีภูเขาไฟสูงชัน แม่น้ำลาวา ที่ราบเถ้าถ่าน และน้ำพุกรดซัลฟิวริก อุดมไปด้วยโลหะ ลาวาข้ามได้เฉพาะทางรางยกระดับเท่านั้น
