[factoriopedia-description]
fusion-generator=ใช้พลาสมาจาก [entity=fusion-reactor] เพื่อผลิตพลังงานไฟฟ้า กำลังผลิตคงที่ แต่ยิ่งอุณหภูมิสูงขึ้น ยิ่งใช้พลาสมาน้อยลง ปล่อยสารหล่อเย็นร้อนออกมาในปริมาณเท่ากับพลาสมาที่ใช้ไป ซึ่งทำให้เย็นลงได้ใน [entity=cryogenic-plant] เครื่องกำเนิดฟิวชันสามารถเชื่อมต่อกันและถ่ายเทพลาสมาระหว่างกันได้
fusion-reactor=ใช้สารหล่อเย็นฟลูออโรคีโตนร่วมกับเซลล์พลังงานฟิวชันเพื่อสร้างพลาสมาความร้อนสูง ส่งออกได้โดยตรงไปยัง [entity=fusion-generator] เท่านั้น เครื่องปฏิกรณ์ฟิวชันที่อยู่ติดกันจะให้โบนัสซึ่งกันและกัน เพิ่มอุณหภูมิพลาสมาอย่างมากโดยไม่เพิ่มปริมาณสารหล่อเย็นที่ใช้
