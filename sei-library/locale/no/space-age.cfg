[tips-and-tricks-item-description]
fulgora-briefing=[planet=fulgora] er en tørr, øde planet uten tegn til liv og farlig lynaktivitet om nettene.\n[entity=solar-panel] er mye svakere, men lyn kan utnyttes med [entity=lightning-rod] og lagres med [entity=accumulator].\nDet finnes ingen naturressurser noe sted på planeten. Det eneste som er igjen er rester i form av [entity=scrap].\nDet som kan ha vært hav er nå fylt med [fluid=heavy-oil] som kan utvinnes med [entity=offshore-pump].\n[tile=oil-ocean-shallow] kan ikke fylles med jord før mye senere, men kan krysses av hevet jernbane. Evnen til å bygge [entity=rail-support] på de dype delene av oljehavet kommer til å kreve videre forskning.
