health=Sunn mat, sunn kropp.
heating-tower=Genererer varme fra kjemiske brensler med veldig høy effektivitet. Stopper ikke forbrenning når maksimal temperatur nås. Avgir varme til tilkoblede varmerør, som kan brukes til dampkraft eller for å hindre frysing.
holmium-processing=Lar deg omdanne holmiummalm til holmiumplater.
lightning-collector=Hent lyn fra et svært område og effektiviser strømproduksjon.
lithium-processing=Litium er det faste grunnstoffet med lavest tetthet. Det er høyt brennbart og vanskelig å lagre.
mech-armor=I ett med maskinen.
planet-discovery-aquilo=En frossen ødemark med bunnløse hav av flytende ammoniakk som ikke kan fylles med jord. Isfjell er det eneste som nærmer seg et solid underlag og kan utvides med isplattform. Bygninger og transportbånd fryser om de ikke varmes av tilstøtende varmerør eller andre varme bygninger, men må plasseres på betong for ikke å fryse isen under.
planet-discovery-fulgora=En tørr og vindherjet planet, med lynstormer på høysletter og hav av olje, som kan krysses med hevet jernbane. \nDet virker som det er noen ruiner.
promethium-science-pack=Brukes for å øke forskningsproduktiviteten, som gjør det lettere å forske frem andre oppgraderinger som gjør det lettere med fremtidige ekspedisjoner til den knuste planeten.
railgun=En elektrisk krysning mellom en kanon og en skarpskytterrifle.
railgun-damage=Det å gjøre skinneprosjektiler tyngre og kraftigere fører til større skader.
railgun-shooting-speed=Forbedringer til kjølesystemer gjør at skinnekanonen kan skyte oftere.
rocket-turret=Et tårn med lang rekkevidde som skyter raketter.
space-platform-thruster=Lar romplattformer flytte seg mellom planeter.
stellar-discovery-solar-system-edge=Slutten! Eller, heller en ny begynnelse. Å bygge en romplattform i stand til å overleve så langt vekk fra den forholdsvise tryggheten til krasjlandingsplassen beviser din evne til å reise hvor som helst i det store dypet av av det interstellare rommet. For en romplattform å overleve denne reisen, må den være spesielt selvforsynt og ha verktøyene nødvendige for å omdanne store og farlige asteroider på veien til brukbare ressurser.
tesla-weapons=Våpen som gjør elektisk skade og spretter mellom fiender.
tree-seeding=Samle trefrø og plant dem på gress eller jord.
turbo-transport-belt=Enda hurtigere transportbånd.
