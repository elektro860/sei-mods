agriculture=მეურნეობის საფუძვლები.
planet-discovery-gleba=ნოტიო, ჭაობიანი პლანეტა მდიდარი ჭაობებით საკვები ნივთიერებებით. ჭაობიან ტერიტორიებს შეუძლიათ სოფლის მეურნეობის მხარდაჭერა, მაგრამ მათზე მშენებლობა რთულია, შესაძლებელია მიწაყრილით გადაფარვა, მაგრამ ქვა მწირია.\nგველისებრ ბორცვებს აქვთ ქვა და მათზე მშენებლობა უკეთესია, მაგრამ სოფლის მეურნეობის მხარდაჭერა არ შეუძლიათ.
planet-discovery-vulcanus=ცხელი ვულკანური პლანეტა მთიანი ვულკანებით, ლავის მდინარეებით, ფერფლის ვაკეებითა და გოგირდმჟავას გეიზერებით. მდიდარია ლითონებით. ლავის გადაკვეთა მხოლოდ ამაღლებული ლიანდაგით არის შესაძლებელი.
rocket-turret=შორ მანძილიანი ტურელი, რომელიც ისვრის რაკეტებს.
space-platform-thruster=აძლევს კოსმოსურ პლატფორმებს სხვა პლანეტებზე გადასვლის საშუალებას.
tungsten-carbide=საშუალებას გაძლევთ დაამზადოთ ვოლფრამის კარბიდი, მყარი, სითბოს მდგრადი კერამიკა. ადვილად ხელმისაწვდომი ვოლფრამის მადანი მოიპოვება ზოგიერთ ვულკანუსის ზედაპირულ ქანში.
