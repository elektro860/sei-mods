[tips-and-tricks-item-description]
agriculture=[entity=agricultural-tower] საშუალებას იძლევა თესლი დათესოთ დასათეს ნიადაგში. დარგული თესლიდან ხეები იზრდება, რომელთა მოსავლის აღებაც შესაძლებელია.\n[entity=yumako-tree] შეიძლება გაიზარდოს [tile=natural-yumako-soil]-ზე. ის წარმოქმნის [item=yumako]-ს, რომელიც შეიცავს [item=yumako-seed]-ს ხის ხელახლა დარგვისთვის.\nპლანტაციის გაფართოება შესაძლებელია ახლომდებარე [tile=wetland-yumako]-ს [item=artificial-yumako-soil]-ით მიწაყრილით ავსება. რუკაზე ეს ადგილები ყვითელია.\n[entity=jellystem] შეიძლება გაიზარდოს [tile=natural-jellynut-soil]-ზე. ის წარმოქმნის [item=jellynut]-ს, რომელიც შეიცავს [item=jellynut-seed]-ს ხის ხელახლა დარგვისთვის.\nპლანტაციის გაფართოება შესაძლებელია ახლომდებარე [tile=wetland-jellynut]-ს [item=artificial-jellynut-soil]-ით მიწაყრილით ავსება. რუკაზე ეს ადგილები მეწამული ფერისაა.
fulgora-briefing=[planet=fulgora] არის მშრალი უსაყოფო პლანეტა არანაირი სიცოცხლის ნიშნებით და სახიფათო ელვის აქტივობა ხშირია ღამის ციკლებში.\n[entity=solar-panel] არის ნაკლებად ეფექტიური მაგრამ ელვა შეიძლება შეიპყრო [entity=lightning-rod]-ით და შეინახო [entity=accumulator]-ში.\nაქ არ არის ნატურალური რესურსები არსად პლანეტაზე. ერთადერთი მატერიალი არის ნარჩენები [entity=scrap]-ის ფორმით.\nრაც შეიძლება იყოს ოკეანეები [fluid=heavy-oil]-ით სავსე შეიძლება ამოიღო [entity=offshore-pump]-ით.\n[tile=oil-ocean-shallow] არ არის მიწაყრილებადი ბევრად უფრო გვიანდელ პერიოდამდე მაგრამ ამაღლებული ლიანდაგებით გადაილახება. [entity=rail-support]-ის აშენება ოკეანის ღრმა ნაწილებში შესაძლებელია დამატებითი კვლევისგან.
gleba-briefing=[planet=gleba] არის ნესტიანი ჭაობიანი პლანეტა მდიდარი ეგზოტიკური მცენარიულობით, რომლის კულტივირებაც შესაძლებელია [entity=agricultural-tower]-ის გამოყენებით და მუშავდება [entity=biochamber]-ში.\nშენ ვერ იპოვი [entity=iron-ore], [entity=copper-ore], [entity=crude-oil], [entity=coal] და [entity=uranium-ore], მაგრამ მცენარეები საჭირო ნივთების წარმოების ალტერნატიულ გზებს გვთავაზობენ.\nუმეტესობა ნივთები სოფლის მეურნეობისგან დროთა განმავლობაში გაფუჭების დამატებითი სირთულეც ახლავს თან. [item=agricultural-science-pack]-იც არის ლიმიტირებული ხანგრძლივობით და ვერ დაგროვდება.\nუზარმაზარი 5 ფეხიანი არსებები ამ პლანეტის მკვიდრი სახეობებია. [entity=solar-panel] არის სუსტი მაგრამ მაინც გამოყენებადია.
orbital-logistics=[entity=space-platform-hub]-ს შეუძლია ლოგისტიკური ქსელიდან მოითხოვოს ნივთების რაკეტებით მოწოდება. შესაძლებელია დაკარგული სამშენებლო მასალების ავტომატური მოთხოვნა.\n[entity=rocket-silo] შეიძლება დაყენდეს ისე, რომ ავტომატურად შეასრულოს კოსმოსური პლატფორმებიდან წამოსული მოთხოვნები.\n[entity=cargo-landing-pad]-ს შეუძლია მოითხოვოს ნივთები მისი პლანეტის გარშემო მოძრავი კოსმოსური პლატფორმიდან, თუ ის უკვე არ ითხოვს ნივთს ამ პლანეტაზე.\n__CONTROL__stack-transfer__ კოსმოსური პლატფორმის ცენტრის გრაფიკულ ინტერფეისში ერთი დასტა ხელით გადადის პლანეტაზე. ნივთები გამოჩნდება [entity=cargo-pod-container]-ში საწყის კოორდინატებზე.
vulcanus-briefing=[planet=vulcanus] არის ცხელი პლანეტა [fluid=water]-ის გარეშე, შენ ვერ იპოვი [entity=crude-oil] ან [entity=uranium-ore]-ს მანდ, მაგრამ მას გააჩნია რამოდენმე ახალი [tooltip=resources,tips-and-tricks-item-description.vulcanus-resources].\n[fluid=lava] არის ულიმიტო რესურსი მინერალების, რომელიც ანაცვლებს [item=stone], [item=iron-ore] და [item=copper-ore]. ესენი შეიძლება იპოვო ნედლი სახით [entity=big-volcanic-rock]-ში.\n[entity=solar-panel] უფრო ეფექტიურია. გარემო არახელსაყრელია და ხასიათდება მთიანი ვულკანებით, ლავის მდინარეებით, ფერფლის ვაკეებით და გოგირდმჟავას გეიზერებით.\n[tile=lava] არ არის მიწაყრილებადი ბევრად უფრო გვიანდელ პერიოდამდე მაგრამ ამაღლებული ლიანდაგებით გადაილახება.
