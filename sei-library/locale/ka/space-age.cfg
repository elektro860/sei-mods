cargo-pod=გამოიყენება ნივთების კოსმოსური პლატფორმიდან პლანეტის ზედაპირზე გადასატანად.\nის ავტომატურად იშვება კოსმოსური პლატფორმის ორბიტაზე მოსვლისთანავე, თუ [entity=cargo-landing-pad] ტვირთს ითხოვს.\nმისი გაგზავნა შესაძლებელია ხელით __CONTROL__stack-transfer__ ბრძანების გამოყენებით კოსმოსური პლატფორმის ცენტრის გრაფიკულ ინტერფეისში ნივთის ხატულაზე.
