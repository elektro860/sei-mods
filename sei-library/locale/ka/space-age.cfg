[factoriopedia-description]
fusion-generator=მოიხმარს პლაზმას [entity=fusion-reactor]-დან ელექტროენერგიის შესაქმნელად. ელექტროენერგიის წარმოება ნომინალურია, მაგრამ უფრო ნაკლები პლაზმა მოიხმარება, თუ ტემპერატურა უფრო მაღალია. ის გამოყოფს გაცხელებულ გამაგრილებელს, რომელიც ტოლია მოხმარებული პლაზმის რაოდენობისა, რომლის გაგრილებაც შესაძლებელია [entity=cryogenic-plant] -ში.
fusion-reactor=იყენებს ფტორიკეტონის გამაგრილებელს შერწყმის ენერგოუჯრედებთან ერთად ზეგახურებული პლაზმის მისაღებად. მისი გამოტანა შესაძლებელია პირდაპირ მხოლოდ [entity=fusion-generator]-ზე. სხვა თერმობირთვულ რეაქტორებთან მეზობლობის ბონუსი მნიშვნელოვნად ზრდის პლაზმის ტემპერატურას გამოყენებული გამაგრილებლის რაოდენობის გაზრდის გარეშე.
