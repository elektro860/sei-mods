[space-location-description]
gleba=ნოტიო, ჭაობიანი პლანეტა ღრმა ჭაობებით, დაკლაკნილი ბორცვებითა და ნაყოფიერი მიწით. მდიდარია საკვები ნივთიერებებით. ჭაობიანი რელიეფი შეიძლება მიწაყრილით აივსოს. მაღალმთიანი რელიეფი რკინიგზას აფერხებს, მაგრამ სოფლის მეურნეობისთვის აუცილებელია.
vulcanus=ცხელი ვულკანური პლანეტა მთიანი ვულკანებით, ლავის მდინარეებით, ფერფლის ვაკეებითა და გოგირდმჟავას გეიზერებით. მდიდარია ლითონებით. ლავის გადაკვეთა მხოლოდ ამაღლებული ლიანდაგით არის შესაძლებელი.
