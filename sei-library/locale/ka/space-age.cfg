offshore-pump=იღებს სითხეს წყლიდან, ლავიდან და სხვადასხვა ოკეანეებიდან.
rocket-silo=გამოიყენება ნივთებისა და მოთამაშეების კოსმოსურ პლატფორმებზე გასაშვებად.
small-demolisher=მასიური ტერიტორიული არსება მაღალი რეგენერაციით. არ მოსწონს როდესაც აწუხებენ.
