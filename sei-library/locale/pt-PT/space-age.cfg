[entity-description]
agricultural-tower=Planta sementes e colhe plantas maduras.
asteroid-collector=Recolhe pequenos asteroides. Os asteroides grandes têm de ser partidos em pedaços mais pequenos por torres.
big-demolisher=Uma enorme criatura territorial com elevada regeneração. Não gosta de ser incomodada.
big-mining-drill=Um extrator maior e mais poderoso com uma grande área de mineração. Pode minerar minérios mais resistentes.
captive-biter-spawner=Esta criatura requer alimento e morrerá lentamente de fome se não for alimentada. Transforma-se ao morrer de fome. Pode ser capturada ao lançar um [item=capture-robot-rocket] contra o [entity=biter-spawner].
capture-robot=Agarra e captura o [entity=biter-spawner] alvo num [entity=captive-biter-spawner].
capture-robot-rocket=Agarra e captura o [entity=biter-spawner] alvo num [entity=captive-biter-spawner].
cargo-bay=Aumenta o tamanho do inventário do terminal e da plataforma de aterragem.
cargo-landing-pad=Cria um local de pouso para todos os itens ejetados a partir das plataformas de espaço em órbita. Faz solicitações logísticas para itens de plataformas orbitais.
cargo-pod=Usado para transferir itens da plataforma espacial para a superfície do planeta.\nÉ lançado automaticamente quando uma plataforma espacial entra em órbita, se o [entity=cargo-landing-pad] estiver a solicitar carga.\nPode ser enviado manualmente através de __CONTROL__stack-transfer__ no ícone do item, na interface do centro da plataforma espacial.
cargo-pod-container=Aparece na superfície do planeta com a carga da plataforma espacial. Ela é destruída após remover a carga.\nQuando [entity=cargo-landing-pad] é construído, os conjuntos de entrega param de chegar às coordenadas iniciais e a carga são entregues diretamente aqui.
copper-stromatolite=Uma formação rochosa causada por bactérias de cobre.
crusher=Pode triturar certos itens, como asteroides, em pedaços mais pequenos.
cryogenic-plant=Crítico para pesquisa e processos criogénicos.
electromagnetic-plant=Crítico para pesquisas e processos eletromagnéticos.
foundry=Permite novas receitas de fundição e metalurgia.
fulgoran-ruin-attractor=Protege uma área pequena contra a queda de raios.
fusion-generator=Consome plasma para criar energia elétrica.
fusion-reactor=Utiliza fluorocetona com células de energia de fusão para produzir plasma.
heating-tower=Gera calor a partir de combustíveis químicos com uma eficiência muito elevada. Não para de queimar quando atinge a temperatura máxima. Transmite o calor para os tubos de calor ligados, que podem ser usados para energia a vapor ou para evitar o congelamento.
iron-stromatolite=Uma formação rochosa causada por bactérias de ferro.
jellystem=Uma abominação de Gleba que produz gelinozes enrugadas.
lightning=Os relâmpagos são um fenómeno natural que danifica entidades desprotegidas e o jogador. Ao mesmo tempo, podem ser usados como uma fonte de energia.
lightning-collector=Protege uma área grande contra a queda de raios e converte a energia para a rede elétrica.
lightning-rod=Protege uma área pequena contra a queda de raios e converte a energia para a rede elétrica.
medium-demolisher=Uma enorme criatura territorial com elevada regeneração. Não gosta de ser incomodada.
offshore-pump=Extrai liquido de corpos de água, lava e vários oceanos.
railgun-turret=Uma torre de canhão elétrico de longo alcance. Eficaz contra inimigos e asteroides.
rocket-silo=Usado para lançar itens e jogadores para plataformas espaciais.
small-demolisher=Uma enorme criatura territorial com elevada regeneração. Não gosta de ser incomodada.
tesla-turret=Eletrocuta um inimigo próximo. O raio elétrico pode saltar para inimigos secundários num arco em cadeia.
thruster=Permite que as plataformas espaciais viajem para outros planetas. Tem de ser construído no limite sul da plataforma espacial.
turbo-splitter=Divide e/ou une a carga de tapetes rolantes em proporções iguais.
turbo-underground-belt=Usado para permitir que um tapete rolante cruze entidades ou terrenos intransponíveis.
yumako-tree=Uma árvore de Gleba que dá frutos yumako nutritivos.
