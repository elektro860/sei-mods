fusion-plasma=Ioni ad altissima temperatura generate in un [entity=fusion-reactor] e consumati da un [entity=fusion-generator]. Non è un fluido normale e non può essere spostato via [entity=pipe], può essere solo spostato tra il reattore ed il generatore a fusione.\nLa temperatura del plasma ne determina il valore energetico.\nUna quantità di plasma rappresenta anche la quantità di refrigerante con cui viaggia, ed il refrigerante riscaldato è rilasciato dal generatore a fusione mentre il plasma è usato come energia.
