[technology-description]
advanced-asteroid-processing=Ottieni una gamma più ampia di risorse dagli asteroidi.
agricultural-science-pack=Applicazioni agricole più avanzate.
agriculture=Le basi dell'agricoltura.
artificial-soil=Crea terreno per seminare più piante.
asteroid-productivity=Applicazioni criogeniche più avanzate.
asteroid-reprocessing=Rielabora le impurità negli asteroidi per ottenere un equilibrio più adatto nelle risorse.
bacteria-cultivation=Moltiplicare i batteri nutrendoli con un po' di bioflux.
battery-mk3-equipment=Inserito nell'armatura per immagazzinare enormi quantità di energia da usare più tardi.
belt-capacity=Aumenta l'altezza delle pile di oggetti stratificati sui rulli di trasporto.
big-mining-drill=Una trivella da miniera più grande e potente con un'area di estrazione più ampia. Consente l'estrazione di minerali più duri, come le parti più dure dei depositi di tungsteno.
biochamber=Un impianto di creazione per processi biologici.
bioflux=Una combinazione di piante diverse potrebbe avere molti usi.
bioflux-processing=Utilizzare il bioflux per ottenere sostanze chimiche in modo biologico.
biolab=Sembra ci sia un modo per far crescere le uova in qualcosa...
biter-egg-handling=Catturare un nido di biter e fornirgli dosi regolari di [item=bioflux] permette la raccolta delle uova di biter, cosa che potrebbe tornare utile...
calcite-processing=Utilizza la calcite per ottenere vapore, acqua e olio pesante.
captive-biter-spawner=Schiudi le uove nei nidi in cattività e piazzali dovunque su Nauvis.
captivity=Una capsula di robotica sparata da un [item=rocket-launcher] inietta una dose di [item=bioflux] nel nido, catturandolo. Con dosi regolari di [item=bioflux], il generatore rimarrà catturato.
carbon-fiber=Alcune piante crescono naturalmente nanotubi di carbonio, che possono essere filati in fibre e tessute in stoffe estremamente resistenti.
cryogenic-plant=Un impianto capace di gestire le temperatura estremamente basse necessarie per la criogenica.
cryogenic-science-pack=Applicazioni criogeniche più avanzate.
electric-weapons-damage=........
electromagnetic-plant=Una struttura artigianale per un uso più avanzato dei magneti e dell'elettricità.
electromagnetic-science-pack=Applicazioni elettromagnetiche più avanzate.
fish-breeding=Trasforma pesci in ancora più pesci.
foundation=Fondamenta ad alta resistenza strutturale con scudi termici e profonde viti. Possono essere piazzate sulla lava, oceano di petrolio e quasi tutta l'acqua.
foundry=Permette fusioni più avanzate e altri progressi metallurgici.
fusion-reactor=Il sistema di concentrazione del plasma permette la produzione di energia elettrica direttamente dalla reazione di fusione senza il bisogno di generatori a vapore.
fusion-reactor-equipment=Inserito nell'armatura serve per alimentare altre apparecchiature.
health=Alimentazione sana, corpo sano.
heating-tower=Genera calore da combustibili chimici con altissima efficienza. Non smette di bruciare quando è alla temperatura massima. Passa il calore ai tubi di calore collegati che possono essere utilizzati per l'energia di vapore, o per evitare il congelamento.
holmium-processing=Permette di convertire il minerale di olmio in piastra di olmio.
jellynut=La noce di gelatina produce melmose noci. Pianta i semi nel terreno noce di gelatina (rosso sulla mappa).
landing-pad-unloading-bay=Gli inseritori possono rimuovere gli oggetti dal compartimento di scarico se è attaccato a una piattaforma d'atterraggio.
laser-weapons-damage=Aumenta il danno delle armi laser.
lightning-collector=Cattura fulmini da un'area più grande e genera energia in maniera più efficiente.
lithium-processing=Il litio è l'elemento solido meno denso, altamente infiammabile e difficile da immagazzinare.
low-density-structure-productivity=Aumenta la produttività delle ricette della struttura a bassa densità.
mech-armor=Diventa un tutt'uno con l'armatura.
metallurgic-science-pack=Permette di esplorare oltre le basi della metallurgia.
overgrowth-soil=Terreno più robusto che permette la crescita delle piante dovunque nel loro bioma.
planet-discovery-aquilo=Una landa desolata congelata con oceani di ammoniaca liquida senza fondo che non possono essere riempiti. Piccoli iceberg sono la cosa più vicina alla terraferma e possono essere espansi con piattaforme di ghiaccio galleggianti. Strutture e nastri trasportatori congeleranno se non riscaldati da un condotto termico o altre strutture calde, ma vanno piazzati sul cemento per non sciogliere il ghiaccio sottostante.
planet-discovery-fulgora=Un arido e ventoso pianeta con tempeste di fulmini sugli altipiani e oceani di petrolio che possono essere scavalcati con i binari sopraelevati.\nSembra di siano delle rovine.
planet-discovery-gleba=Un umido pianeta paludoso con paludi ricche di nutrienti. Gli acquitrini possono sopportare l'agricoltura ma sono complicati da edificare, possono essere riempiti ma la pietra scarseggia.\nLe colline serpeggianti sono ricche di pietra e più solide per costruire ma non possono sopportare l'agricoltura.
planet-discovery-vulcanus=Un caldo pianeta vulcanico con vulcani montuosi, fiumi di lava, piane di cenere e geyser di acido solforico. Ricco in metalli. La lava può essere attraversata solo con binari sopraelevati.
plastic-bar-productivity=Aumenta la produttività delle ricette della barra di plastica.
processing-unit-productivity=Aumenta la produttività delle ricette dell'unità di lavorazione.
promethium-science-pack=Utilizzato per aumentare la produttività della ricerca, che rende più semplice ricercare miglioramenti che renderanno future spedizioni verso il Pianeta Frantumato più semplici.
quantum-processor=Un processore che sfrutta diversi fenomeni quantistici per varie applicazioni.
rail-support-foundations=Permette di costruire rotaie sopraelevate anche su oceano di petrolio profondo.
railgun=Un incrocio elettrico tra un cannone e un fucile da cecchino.
railgun-damage=Maggiori danni per il cannone a rotaia rendendo i proiettili più densi e resistenti.
railgun-shooting-speed=Migliori sistemi di raffreddamento permettono al cannone a rotaia di sparare più spesso.
research-productivity=Aumenta la quantità di ricerca svolta per pacchetto scientifico consumato.
rocket-fuel-productivity=Aumenta la produttività delle ricette del combustibile per razzi.
rocket-part-productivity=Aumenta la produttività della creazione del pezzo di razzo.
rocket-silo=Utilizzato per lanciare oggetti e giocatori sulle piattaforme spaziali.
rocket-turret=Una torretta a lungo raggio che spara razzi.
scrap-recycling-productivity=Aumenta il rendimento del riciclaggio dei rottami.
space-platform=Trasforma i frammenti di asteroide in materiali utili.
space-platform-thruster=Consente alle piattaforme spaziali di spostarsi su altri pianeti.
space-science-pack-space-age=Produzione di [item=space-science-pack] su una piattaforma spaziale.
stack-inserter=Gli inseritori a strati multipli sono in grado di mettere gli oggetti sui rulli di trasporto in pile stratificate, ma aspettano che la loro mano sia piena prima di muoversi.
steel-plate-productivity=Aumenta la produttività della piastra d'acciaio e dell'acciaio fuso.
stellar-discovery-solar-system-edge=La fine! O meglio, un nuovo inizio. Costruire una piattaforma spaziale in grado di sopravvivere così lontano dalla relativa salvezza del luogo dello schianto prova la tua capacità di viaggiare nelle grandi profondità dello spazio interstellare. Per sopravvivere a un viaggio del genere, una piattaforma spaziale dovrebbe essere particolarmente autosufficiente e avere gli strumenti necessari per trasformare i grandi, pericolosi asteroidi sulla via in risorse utilizzabili.
tesla-weapons=Armi che infliggono danni elettrici e rimbalzano tra i nemici.
toolbelt-equipment=Inserito nell'armatura per espandere il tuo inventario.
tree-seeding=Raccogliere i semi degli alberi e piantarli sull'erba o sulla terra.
tungsten-carbide=Permette la produzione di carburo di tungsteno, una ceramica resistente al calore. Il tungsteno grezzo è facilmente accessibile da alcune rocce superficiali di Vulcanus.
tungsten-steel=Consente di realizzare piastre di acciaio al tungsteno.
turbo-transport-belt=Rulli di trasporto ancora più veloci.
yumako=L'albero di yumako produce gustosi frutti nutrienti. Pianta i semi nel terreno yumako (giallo sulla mappa).
