[entity-description]
agricultural-tower=Menanam benih dan memanen tanaman dewasa.
asteroid-collector=Mengumpulkan asteroid kecil. Asteroid besar harus dipecah menjadi potongan-potongan kecil menggunakan menara penembak.
big-demolisher=Sebuah mahkluk raksasa teritorier dengan regenerasi yang tinggi. Tidak suka diganggu.
big-mining-drill=Bor yang lebih besar dan lebih kuat dengan area penambangan yang luas. Dapat menambang bijih yang lebih keras.
captive-biter-spawner=Mahkluk ini membutuhkan makanan dan akan mulai kelaparan jika tidak diberi makan. Akan berubah saat kelaparan. Dapat ditangkap dengan menarget [entity=biter-spawner] dengan [item=capture-robot-rocket]
capture-robot=Mengait dan menangkap [entity=biter-spawner] yang ditarget menjadi [entity=captive-biter-spawner].
capture-robot-rocket=Mengait dan menangkap [entity=biter-spawner] yang ditarget menjadi [entity=captive-biter-spawner].
cargo-bay=Meningkatkan ukuran inventaris hub dan landasan pendaratan.
cargo-landing-pad=Membuat tempat pendaratan untuk semua item yang dikirim dari platform luar angkasa di orbit. Membuat permintaan logistik untuk item dari platform yang mengorbit.
cargo-pod=Digunakan untuk memindahkan item dari platform luar angkasa ke permukaan planet.\nAkan diluncurkan secara otomatis saat platform luar angkasa tiba di orbit jika [entity=cargo-landing-pad] meminta kargo.\nDapat dikirim secara manual dengan __CONTROL__stack-transfer__ pada ikon item di GUI hub platform luar angkasa.
cargo-pod-container=Muncul di permukaan planet dengan kargo dari platform luar angkasa. Akan hancur saat kargo diambil.\nSaat [entity=cargo-landing-pad] dibangun, pod pengirim akan berhenti datang di koordinat asal, dan kargo akan dikirim langsung kesana.
copper-stromatolite=Sebuah formasi bebatuan yang diakibatkan oleh bakteri tembaga.
crusher=Dapat menghancurkan benda tertentu, seperti asteroid, menjadi bongkahan yang lebih kecil.
electromagnetic-plant=Penting untuk penelitian dan proses elektromagnetis.
foundry=Memungkinkan resep peleburan dan metalurgi baru.
fulgoran-ruin-attractor=Melindungi area kecil dari sambaran petir.
fusion-generator=Memakai plasma untuk menghasilkan energi listrik.
fusion-reactor=Menggunakan fluorinketon bersama inti fusi untuk membuat plasma.
heating-tower=Menghasilkan panas dari bahan bakar kimia dengan efisiensi sangat tinggi. Tidak akan berhenti membakar walaupun suhu telah maksimum. Meneruskan panas ke pipa panas terhubung yang bisa digunakan untuk tenaga uap, atau mencegah pembekuan.
iron-stromatolite=Sebuah formasi bebatuan yang diakibatkan oleh bakteri besi.
lightning=Petir merupakan fenomena natural yang merusak entitas dan pemain yang tidak dilindungi. Di sisi lain, dapat juga digunakan sebagai sumber energi.
lightning-collector=Melindungi area besar dari sambaran petir dan menyalurkan energinya ke jaringan listrik.
lightning-rod=Melindungi area kecil dari sambaran petir dan menyalurkan energinya ke jaringan listrik.
medium-demolisher=Sebuah mahkluk raksasa teritorier dengan regenerasi yang tinggi. Tidak suka diganggu.
offshore-pump=Mengekstrak cairan dari air, lava, dan berbagai lautan.
railgun-turret=Sebuah meriam listrik jarak jauh. Ampuh melawan musuh dan asteroid.
rocket-silo=Digunakan untuk meluncurkan barang dan pemain ke platform luar angkasa.
small-demolisher=Sebuah mahkluk raksasa teritorier dengan regenerasi yang tinggi. Tidak suka diganggu.
space-platform-hub=Hub platform adalah inti dari platform luar angkasa. Ia menerima item dari planet dan mengirim item ke landasan pendaratan kargo. Dibuat dengan meluncurkan [item=space-platform-starter-pack].
stack-inserter=Lengan tumpuk yang mempu mengisi konveyor dalam lapisan.
tesla-turret=Menyetrum musuh terdekat. Sambaran listrik dapat melompat ke musuh kedua dalam rangkaian berantai.
thruster=Memungkinkan platform luar angkasa untuk pergi ke planet lain. Harus dibuat di sisi selatan dari platform luar angkasa.
turbo-splitter=1:1 Memisah dan/atau menggabungkan kargo konveyor.
turbo-underground-belt=Digunakan untuk memungkinkan konveyor melintasi entitas atau medan yang tidak dapat dilewati.
