[space-location-description]
aquilo=Sebuah gurun beku dengan samudra amonia cair dan lubang fluorin. Bangunan dan konveyor akan membeku bila tidak dihangatkan dengan pipa panas atau bangunan panas lainnya di sampingnya.
fulgora=Sebuah planet gersang berangin dengan badai petir di dataran tinggi, dan lautan minyak yang bisa dijembatani menggunakan rel layang.\nKelihatannya ada beberapa reruntuhan.
gleba=Sebuah planet lembab berawa dengan rawa dalam, tebing berliku, dan tanah subur. Kaya akan nutrisi. Medan berawa dapat diisi dengan tanah. Dataran tinggi menghalangi rel tetapi dibutuhkan untuk pertanian.
shattered-planet=Sebuah sisa dari dunia misterius jauh di kedalaman luar angkasa. Peninggalannya, mengambang di tempat ia pernah ada, memegang kunci untuk membuka teknologi yang kuat. Namun, mengambilnya bukan tanpa risiko...
solar-system-edge=Sebuah akhir! Atau mungkin, sebuah awal baru. Membangun sebuah platform luar angkasa yang mampu untuk bertahan sejauh ini, diluar keamanan tempat pendaratanmu membuktikan kemampuanmu untuk pergi kemana saja, keluar sana diantara bintang-bintang. Agar sebuah platform luar angkasa dapat bertahan dalam perjalanan ini, perlu untuknya mandiri dan memiliki perlengkapan untuk mengubah asteroid yang besar dan berbahaya di jalan menjadi sumber daya yang dapat digunakan.
vulcanus=Sebuah planet panas dengan gunung-gunung vulkanik, lautan lava, hamparan debu, dan geyser asam sulfat. Kaya akan logam. Lava hanya bisa dilewati dengan rel layang.
