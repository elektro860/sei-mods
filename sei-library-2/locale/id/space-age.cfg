[tips-and-tricks-item-description]
agriculture=[entity=agricultural-tower] memungkinkan penanaman benih ke dalam tanah yang dapat ditanami. Benih yang ditanam akan tumbuh menjadi pohon yang dapat dipanen.\n[entity=yumako-tree] dapat tumbuh di [tile=natural-yumako-soil]. Pohon ini menghasilkan [item=yumako] yang berisi [item=yumako-seed] untuk menanam kembali pohon tersebut.\nPerkebunan dapat diperluas dengan menimbun [tile=wetland-yumako] di dekatnya dengan [item=artificial-yumako-soil]. Area ini berwarna kuning pada peta.\n[entity=jellystem] dapat tumbuh di [tile=natural-jellynut-soil]. Pohon ini menghasilkan [item=jellynut] yang berisi [item=jellynut-seed] untuk menanam kembali pohon tersebut.\nPerkebunan dapat diperluas dengan menimbun [tile=wetland-jellynut] di dekatnya dengan [item=artificial-jellynut-soil]. Area ini berwarna magenta pada peta.
aquilo-briefing=[planet=aquilo] adalah gurun beku dengan samudra amonia. Ini adalah planet terjauh di mana penggunaan [entity=solar-panel] sangat tidak mungkin.\n[entity=logistic-robot] dan [entity=construction-robot] jauh lebih lemah di sini.\nSatu-satunya sumber daya yang familiar di sini adalah [entity=crude-oil] sehingga pangkalan akan bergantung pada logistik planet. Kamu bisa terdampar disini tanpa dukungan yang cukup dari planet lain!\nPermukaannya cukup kecil dan perlu diperluas. Lautan dapat ditutup dengan [item=ice-platform] agar dapat dilalui. [item=concrete] digunakan sebagai fondasi untuk bangunan dan melindungi agar es tidak mencair.\nEntitas perlu dipanaskan agar dapat beroperasi menggunakan [entity=heating-tower] dan [entity=heat-pipe].
asteroid-defense=[entity=gun-turret] dapat digunakan untuk memecah asteroid besar menjadi bongkahan asteroid. Bongkahan tersebut dapat diambil oleh [entity=asteroid-collector] dan diproses di platform untuk sumber daya. Asteroid besar akan merusak platform jika ditabrak.
fulgora-briefing=[planet=fulgora] adalah planet yang gersang tanpa tanda kehidupan dan aktivitas petir yang berbahaya didalam siklus malam yang cepat\n[entity=solar-panel] sangat tidak efektif namun petir dapat ditangkap dengan [entity=lightning-rod] dan disimpan di [entity=accumulator].\nTidak ada sumber daya natural apapun yang bisa ditemukan di planet ini. Yang tersedia hanyalah apapun yang tersisa dari [entity=scrap].\nApa yang mungkin dulunya sebuah samudra sekarang penuh akan [fluid=heavy-oil] yang bisa diambil menggunakan [entity=offshore-pump].\n[tile=oil-ocean-shallow] Tidak bisa diisi tanah sampai nanti tetapi sekarang bisa dilewati menggunakan rel layang. Membangun [entity=rail-support] diatas bagian samudra dalam membutuhkan penelitian lebih lanjut.
gleba-briefing=[planet=gleba] adalah planet lembab berawa dengan tumbuhan eksotis rimbun yang dapat dibudidayakan dengan [entity=agricultural-tower] dan diproses di [entity=biochamber].\nKamu bisa menemukan [entity=iron-ore], [entity=copper-ore], [entity=crude-oil], [entity=coal], dan [entity=uranium-ore] disana namun tumbuh-tumbuhan memungkinkan cara lain untuk memproduksi item yang dibutuhkan.\nKebanyakan item dari pertanian menambah kerepotan karena dapat basi seiring waktu. [item=agricultural-science-pack] pun memiliki masa aktif terbatas sehingga tidak bisa disimpan lama.\nMahkluk besar berkaki 5 adalah spesies pribumi planet ini. [entity=solar-panel] lebih lemah tetapi masih bisa digunakan.
heating-mechanics=[entity=heating-tower] dapat menghasilkan panas dari bahan bakar dan tidak berhenti membakar ketika mencapai suhu maksimum.\nIa menggunakan [entity=heat-pipe] untuk mentransfer panas ke entitas lain.\nSetiap entitas perlu bersentuhan dengan sumber panas agar tidak membeku.\nPengecualiannya adalah tiang listrik, [entity=solar-panel] dan [entity=accumulator].
lava-processing=[fluid=lava] dapat dipompa dengan [entity=offshore-pump] dan diproses di [entity=foundry] menjadi [item=stone], [fluid=molten-iron] dan [fluid=molten-copper].\nKamu bisa menghilangkan barang yang tidak berguna dengan memindahkannya langsung ke [tile=lava].
lightning-mechanics=[entity=lightning-rod] melindungi area kecil dari sambaran petir dan mengubah energinya menjadi listrik.\nPetir menghasilkan sejumlah besar energi dalam waktu singkat. Memiliki lebih banyak [entity=accumulator] akan memungkinkan penggunaan yang lebih baik dari setiap sambaran petir.\nIni dapat diganti kemudian dengan [entity=lightning-collector] yang lebih efisien.
orbital-logistics=[entity=space-platform-hub] dapat meminta item dari jaringan logistik untuk dikirimkan oleh roket. Kamu bisa untuk meminta material konstruksi yang dibutuhkan secara otomatis.\n[entity=rocket-silo] dapat diatur untuk secara otomatis memenuhi permintaan dari platform luar angkasa.\n[entity=cargo-landing-pad] dapat meminta item dari platform luar angkasa yang mengorbit planetnya, kecuali jika sudah meminta item tersebut di planet ini.\n__CONTROL__stack-transfer__ di GUI hub platform luar angkasa mentransfer satu tumpukan secara manual ke planet. Item akan muncul di [entity=cargo-pod-container] pada koordinat awal.
production-entity-list=[entity=electric-mining-drill] Bor tambang listrik \n[entity=big-mining-drill] Bor tambang besar \n[entity=pumpjack] Pompa minyak \n[entity=assembling-machine-2] Mesin perakit 2 \n[entity=assembling-machine-3] Mesin perakit 3 \n[entity=electric-furnace] Tungku listrik \n[entity=recycler] Pendaur ulang \n[entity=chemical-plant] Pabrik kimia \n[entity=centrifuge] Sentrifugal \n[entity=crusher] Penghancur \n[entity=foundry] Pengecor logam \n[entity=agricultural-tower] Menara pertanian \n[entity=electromagnetic-plant] Pabrik elektromagnetis \n[entity=cryogenic-plant] Pabrik kriogenik
removing-trash-in-space=[entity=inserter] dapat digunakan untuk membuang item dengan memindahkan mereka ke luar angkasa.
space-platform=Platform luar angkasa dibangun dari jarak jauh, dengan material konstruksi yang dikirim oleh roket. Platform ini dapat digunakan untuk mengangkut pemain dan kargo antar planet.\n\n- [item=space-platform-starter-pack] digunakan untuk menginisialisasi platform, yang kemudian diperluas menggunakan [item=space-platform-foundation].\n- [entity=asteroid-collector] menangkap asteroid dari luar angkasa untuk mendapatkan material.\n- [entity=crusher] digunakan untuk menghancurkan asteroid untuk mendapatkan sumber daya.
space-science=Di Space Age, [item=space-science-pack] hanya bisa diproduksi pada platform luar angkasa menggunakan bongkahan asteroid yang telah diproses.
spoilables=Sebuah item dengan properti basi [img=utility/tooltip_category_spoilable] memiliki masa hidup yang terbatas. Saat kadaluarsa, item akan basi dan menjadi item lain, seperti [item=spoilage].\nSebuah item dengan kualitas lebih tinggi akan lebih tahan lama.
spoilables-research=[item=agricultural-science-pack] memberi lebih sedikit bila basi.
spoilables-result=Kebasian bahan akan memengaruhi kebasian produk hasil.
vulcanus-resources=Sumber daya Vulcanus:\n[entity=sulfuric-acid-geyser] geyser asam sulfat \n[entity=calcite] Kalsit \n[entity=tungsten-ore] Bijih tungsten
