agriculture=Dasar-dasar pertanian.
artificial-soil=Membuat tanah untuk pembenihan lebih banyak tanaman.
artillery-shell-damage=Meningkatkan kerusakan artileri.
asteroid-productivity=Meningkatkan hasil dari penghancuran asteroid.
asteroid-reprocessing=Memroses kembali ketidakmurnian di asteroid untuk mendapat keseimbangan sumber daya yang lebih cocok.
bacteria-cultivation=Melipatgandakan bakteri dengan memberi makan mereka beberapa biofluks.
belt-capacity=Meningkatkan tinggi lapisan tumpukan dari item diatan konveyor.
big-mining-drill=Sebuah bor penambang lebih besar dan lebih kuat dengan area penambangan lebih lebar. Memungkinkan penambangan bijih yang lebih keras seperti bagian yang lebih keras dari titik sumber daya tungsten.
bioflux=Gabungan dari macam macam tanaman bisa memiliki banyak kegunaan.
bioflux-processing=Menggunakan biofluks untuk mendapatkan bahan kimia secara biologis.
biolab=Sepertinya ada cara untuk menernakkan telur-telur ini menjadi sesuatu...
biter-egg-handling=Menangkap sebuah sarang biter dan menyediakannya dosis rutin [item=bioflux] memungkinkan telur biter dipanen, mungkin mereka bisa berguna untuk sesuatu...
calcite-processing=Gunakan kalsit untuk mendapat uap, air, dan minyak berat.
captive-biter-spawner=Tetaskan telur menjadi sarang yang tertangkap dan taruh dimana saja di Nauvis.
captivity=Sebuah kapsul robot yang ditembak dari [item=rocket-launcher] memasukkan sebuah dosis [item=bioflux] ke sarang, menangkapnya. Dengan dosis rutin akan [item=bioflux], sarang akan tetap tertangkap.
carbon-fiber=Beberapa tanaman secara natural menghasilkan karbon nanotube, yang bisa dipintal menjadi benang, dan ditenun menjadi kain yang sangat kuat.
cryogenic-plant=Sebuah fasilitas perakitan tahan akan suhu rendah ekstrim yang dibutuhkan untuk kriogenik.
cryogenic-science-pack=Aplikasi kriogenik yang lebih canggih.
electric-weapons-damage=Meningkatkan kerusakan sinar listrik.
electromagnetic-plant=Sebuah fasilitas perakitan untuk penggunaan magnet dan listrik yang lebih canggih.
electromagnetic-science-pack=Aplikasi elektromagnetis yang lebih canggih.
foundation=Fondasi struktur canggih dengan perlindungan panas dan pasak dalam. Dapat ditempatkan di lava, samudra minyak, dan sebagian besar air.
foundry=Memungkinkan peleburan lebih canggih dan kemajuan metalurgi lainnya.
fusion-reactor=Sistem fokus plasma padat memungkinkan kita menghasilkan energi langsung dari reaksi fusi tanpa menggunakan turbin uap.
fusion-reactor-equipment=Dimasukkan ke zirah untuk memberi daya ke perlengkapan lain.
health=Makan sehat, tubuh kuat.
heating-tower=Menghasilkan panas dari bahan bakar kimia dengan efisiensi sangat tinggi. Tidak akan berhenti membakar walaupun suhu telah maksimum. Meneruskan panas ke pipa panas terhubung yang bisa digunakan untuk tenaga uap, atau mencegah pembekuan.
holmium-processing=Memungkinkanmu mengubah bijih holmium menjadi lempengan holmium.
jellynut=Batang jeli menghasilkan jellynut kenyal. Tanam benih pada tanah jellynut (warna magenta di peta).
laser-weapons-damage=Meningkatkan kerusakan sinar laser.
lightning-collector=Menarik petir dengan jangkauan lebar dan menghasilkan energi lebih efisien.
lithium-processing=Litium adalah elemen padat paling berongga, mudah terbakar, dan sulit disimpan.
mech-armor=Jadi mesin, jadi mesin.
metallurgic-science-pack=Memungkinkan pembelajaran metalurgi di luar dasar.
overgrowth-soil=Tanah yang lebih tahan memungkinkan penumbuhan tanaman dimana saja dalam bioma mereka.
planet-discovery-aquilo=Sebuah gurun beku dengan samudra amonia cair tak berdasar yang tidak bisa ditimbun. Gunung es adalah hal terdekat dengan tanah dan dapat diperluas dengan platform es. Bangunan dan konveyor akan membeku jika tidak diberi panas oleh pipa panas disampingnya atau sumber panas lain, tetapi harus ditaruh diatas beton untuk tidak mencairkan es dibawahnya.
planet-discovery-fulgora=Sebuah planet gersang berangin dengan badai petir di dataran tinggi, dan lautan minyak yang bisa dijembatani menggunakan rel layang.\nKelihatannya ada beberapa reruntuhan.
planet-discovery-gleba=Sebuah planet berawa penuh dengan rawa kaya nutrisi. Rawa dapat mendukung pertanian tetapi pembangunan akan sulit, diperlukan banyak lahan tetapi bebatuan tidak banyak tersedia.\nBukit yang mengular memiliki bebatuan dan lebih baik untuk pembangunan tetapi tidak mendukung pertanian.
planet-discovery-vulcanus=Sebuah planet panas dengan gunung-gunung vulkanik, lautan lava, hamparan debu, dan geyser asam sulfat. Kaya akan logam. Lava hanya bisa dilewati dengan rel layang.
promethium-science-pack=Digunakan untuk meningkatkan produktivitas penelitian, yang akan memudahkan penelitian peningkatan lain dan membuat ekspedisi menuju planet musnah selanjutnya lebih mudah.
quantum-processor=Sebuah alat pemroses yang memanfaatkan beberapa fenomena kuantum untuk berbagai aplikasi.
rail-support-foundations=Memungkinkan membuat rel layang juga diatas bagian dalam dari samudra minyak di [planet=fulgora].
railgun=Sebuah persilangan antara sniper dan meriam yang berdaya listrik.
railgun-damage=Membuat peluru railgun lebih padat dan kuat menghasilkan lebih banyak serangan.
railgun-shooting-speed=Sistem pendinginan yang lebih baik berarti railgun bisa menembak lebih sering.
research-productivity=Meningkatkan jumlah progres penelitian per paket sains yang dipakai.
rocket-silo=Digunakan untuk meluncurkan barang dan pemain ke platform luar angkasa.
rocket-turret=Sebuah penembak jarak jauh yang menembak roket.
space-platform=Mengolah bongkahan asteroid menjadi material berguna.
space-platform-thruster=Memungkinkan platform luar angkasa untuk bergerak ke planet lain.
space-science-pack-space-age=Produksi dari [item=space-science-pack] diatas platform luar angkasa.
stack-inserter=Lengan tumpuk mampu menaruh berlapis-lapis item diatas konveyor, tapi mereka akan menunggu sampai tangan mereka penuh sebelum memindahkan.
tesla-weapons=Senjata yang menghasilkan kerusakan listrik dan melompat diantara musuh.
tree-seeding=Mengambil benih pohon dan menanamnya pada rumput atau tanah.
tungsten-carbide=Memungkinkan kamu membuat tungsten karbida, sebuah keramik keras tahan panas. Bijih tungsten dapat mudah didapat pada bebatuan di Vulcanus.
tungsten-steel=Memungkinkan kamu membuat lempengan baja-tungsten.
turbo-transport-belt=Konveyor yang lebih cepat lagi.
yumako=Pohon yumako menghasilkan buah enak bernutrisi. Tanam benih di tanah yumako (warna kuning di peta).
