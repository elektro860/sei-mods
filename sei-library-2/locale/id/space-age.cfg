fusion-generator=Mengonsumsi plasma dari [entity=fusion-reactor] untuk menghasilkan energi. Penghasilan listrik tidak berubah, tapi lebih sedikit plasma yang dipakai bila suhu lebih tinggi. Mesin ini mengeluarkan pendingin yang lebih panas sama dengan jumlah plasma yang dipakai, pendingin dapat didinginkan di dalam [entity=cryogenic-plant]. Generator fusi dapat saling terhubung dan mengalirkan plasma.
fusion-reactor=Menggunakan pendingin fluorinketon dengan inti fusi untuk membuat plasma super-panas. Hanya bisa dialirkan langsung ke sebuah [entity=fusion-generator]. Bonus kedekatan dengan reaktor fusi lain sangat meningkatkan suhu plasma tanpa meningkatkan jumlah pendingin yang dipakai.
[fluid-description]
fusion-plasma=Ion bersuhu sangat tinggi yang dibuat di [entity=fusion-reactor] dan dipakai oleh sebuah [entity=fusion-generator]. Ini bukanlah cairan biasa dan tidak bisa dialirkan dengan [entity=pipe], hanya dapat dialirkan melewati reaktor Fusi dan genset Fusi.\nSuhu dari plasma menentukan nilai energinya.\nKuantitas plasma juga menentukan kuantitas pendingin yang dipanaskan oleh genset Fusi saat plasma dipakai untuk energi.
