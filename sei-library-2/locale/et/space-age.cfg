[tips-and-tricks-item-description]
agriculture=[entity=agricultural-tower] võimaldab seemneid istutada külvamiskõlblikku mulda. Istutatud seemned kasvavad puudeks, mida saab raiuda.\n[entity=yumako-tree] võib kasvada [tile=natural-yumako-soil]e peal. See annab [item=yumako], mis sisaldab [item=yumako-seed] puu uuesti istutamiseks.\nIstandust saab laiendada, täites lähedal asuva [tile=wetland-yumako] [item=artificial-yumako-soil]ga. Need alad on kaardil kollased.\n[entity=jellystem] võib kasvada [tile=natural-jellynut-soil]e peal. See toodab [item=jellynut], mis sisaldab [item=jellynut-seed] puu uuesti istutamiseks.\nIstandust saab laiendada, täites lähedal asuvaid [tile=wetland-jellynut] alasid [item=artificial-jellynut-soil] abil. Need alad on kaardil magenta värvi.
aquilo-briefing=[planet=aquilo] on jäine kõrb, mille ookeanid sisaldavad ammoniaaki. See on kõige kaugem planeet, kus [entity=solar-panel] kasutamine on praktiliselt võimatu.\n[entity=logistic-robot] ja [entity=construction-robot] on siin palju nõrgemad.\nAinus tuttav ressurss siin on [entity=crude-oil], seega sõltub baas planeedi logistikast. Mängija võib jääda hätta, kui tal puudub piisav toetus teistelt planeetidelt!\nPindala on üsna väike ja seda tuleb laiendada. Ookeane saab [item=ice-platform] abil täita, et neil saaks kõndida. [item=concrete] kasutatakse hoonete vundamendina ja see kaitseb jääd sulamise eest.\nÜksuste töötamiseks tuleb neid kütta, kasutades [entity=heating-tower] ja [entity=heat-pipe].
asteroid-defense=[entity=gun-turret] abil saab suuremaid asteroide tükkideks purustada. Neid saab [entity=asteroid-collector] abil kokku korjata ja platvormil ressursside saamiseks töödelda. Suuremad asteroidid tekitavad kokkupõrkel platvormile kahju.
fulgora-briefing=[planet=fulgora] on kuiv ja viljatu planeet, kus puuduvad elu märgid ning sagedaste öötsüklite ajal esineb ohtlikku välku.\n[entity=solar-panel] on palju vähem tõhus, kuid välku saab koguda [entity=lightning-rod] abil ja salvestada [entity=accumulator]sse.\nKogu planeedil ei leidu loodusvarasid. Ainsad kättesaadavad asjad on jäägid [entity=scrap] kujul.\nSee, mis võis kunagi olla ookean, on nüüd täis [fluid=heavy-oil]i, mida saab pumbata [entity=offshore-pump] abil.\n[tile=oil-ocean-shallow] ei ole täidetav kuni palju hiljem, kuid seda saab ületada kõrgendatud rööbastega. [entity=rail-support] ehitamine ookeani sügavamatesse osadesse nõuab täiendavaid uuringuid.
gleba-briefing=[planet=gleba] on niiske, soine planeet, millel kasvab rikkalik eksootiline taimestik, mida saab harida [entity=agricultural-tower] abil ja töödelda [entity=biochamber]is.\nSealt ei leia [entity=iron-ore], [entity=copper-ore], [entity=crude-oil], [entity=coal] ega [entity=uranium-ore], kuid taimed pakuvad alternatiivseid võimalusi vajalike esemete tootmiseks.\nEnamikul põllumajandusest saadud esemetel on lisaprobleemiks see, et need riknevad aja jooksul. Isegi [item=agricultural-science-pack] on piiratud kasutusajaga ja seda ei saa varuda.\nSuured viiejalalised olendid on selle planeedi kohalikud liigid. [entity=solar-panel] on nõrgem, kuid siiski kasutatav.
heating-mechanics=[entity=heating-tower] suudab kütusest soojust toota ja ei lõpeta põlemist ka maksimaalse temperatuuri saavutamisel.\nSee kasutab [entity=heat-pipe] soojuse edastamiseks teistesse üksustesse.\nIga objekt peab puutuma kokku soojusallikaga, et mitte külmuda.\nErandiks on elektripostid, [entity=solar-panel] ja [entity=accumulator].
lava-processing=[fluid=lava] saab pumbata [entity=offshore-pump] abil ja töödelda [entity=foundry]s [item=stone]iks, [fluid=molten-iron]iks ja [fluid=molten-copper]iks.\nJäätmeid on võimalik kõrvaldada, viies need otse [tile=lava]sse.
lightning-mechanics=[entity=lightning-rod] kaitseb väikest ala välklöökide eest ja suunab selle energia elektrivõrku.\nVälk tekitab lühikese aja jooksul suurt kogust energiat. Rohkemate [entity=accumulator]de abil on võimalik iga välklööki paremini ära kasutada.\nSelle võib hiljem asendada tõhusama [entity=lightning-collector]ga.
orbital-logistics=[entity=space-platform-hub] saab pärida logistikavõrgust esemete tarnimist rakettidega. Puuduvaid ehitusmaterjale on võimalik pärida automaatselt.\n[entity=rocket-silo] saab seadistada automaatselt täitma päringuid kosmoseplatvormidelt.\n[entity=cargo-landing-pad] saab pärida esemeid planeedi orbiidil olevalt kosmoseplatvormilt, välja arvatud juhul, kui see juba pärib seda eset sellel planeedil.\n__CONTROL__stack-transfer__ kosmoseplatvormi keskuse liideses teisaldab ühe virna käsitsi planeedile. Esemed ilmuvad lähtekoordinaatidel asuvas [entity=cargo-pod-container].
production-entity-list=[entity=electric-mining-drill] Elektriline kaevanduspuur \n[entity=big-mining-drill] Suur kaevanduspuur \n[entity=pumpjack] Naftapump \n[entity=assembling-machine-2] Kokkupaneku masin 2 \n [entity=assembling-machine-3] Kokkupaneku masin 3 \n[entity=electric-furnace] Elektriahi \n[entity=recycler] Taaskasutaja \n[entity=chemical-plant] Keemiatehas \n[entity=centrifuge] Tsentrifuug \n[entity=crusher] Purusti \n[entity=foundry] Valukoda \n[entity=agricultural-tower] Põllumajandustorn \n[entity=electromagnetic-plant] Elektromagnetjaam \n[entity=cryogenic-plant] Krüogeenikajaam
removing-trash-in-space=[entity=inserter] abil saab jäätmeid eemaldada, viies need kosmose tühjusesse.
space-platform=Kosmoseplatvorm ehitatakse kaugjuhtimisega, ehitusmaterjalid tarnitakse raketitega. Seda saab kasutada mängijate ja kauba transportimiseks planeetide vahel.\n\n- [item=space-platform-starter-pack] kasutatakse platvormi käivitamiseks, mida seejärel laiendatakse [item=space-platform-foundation] abil.\n- [entity=asteroid-collector] püüab kosmosest asteroide materjalide saamiseks.\n- entity=crusher] kasutatakse asteroidide purustamiseks ressursside saamiseks.
space-science=Kosmoseajastus saab [item=space-science-pack]i toota vaid kosmoseplatvormil töödeldud asteroiditükkidest.
spoilables=Esemel, millel on omadus [img=utility/tooltip_category_spoilable] "rikneb", on piiratud kõlblikkusaeg. Kui aeg möödub, rikneb ese ja muutub teiseks esemeks, näiteks [item=spoilage].\nKõrgema kvaliteediga ese püsib värskena kauem.
spoilables-research=Mida rohkem riknenud, seda vähem väärtust [item=agricultural-science-pack] annab.
spoilables-result=Koostisosa riknemise edenemine mõjutab toote riknemise edenemist.
vulcanus-briefing=[planet=vulcanus] on kuum planeet, kus puudub [fluid=water]; sealt ei leia [entity=crude-oil] ega [entity=uranium-ore], kuid seal leidub mitmeid uusi [tooltip=resources,tips-and-tricks-item-description.vulcanus-resources].\n[fluid=lava] on lõputu mineraalide allikas, mis asendab [item=stone], [item=iron-ore] ja [item=copper-ore] leiukohti. Neid leidub toores vormis ainult [entity=big-volcanic-rock] sees.\n[entity=solar-panel] on palju tõhusam. Keskkond on eluks sobimatu, seal on mägised vulkaanid, laavajõed, tuha tasandikud ja väävelhappe geisrid.\n[tile=lava] ei ole täidetav kuni palju hiljem, kuid seda saab ületada kõrgendatud rööbastega.
vulcanus-resources=Vulcanuse loodusvarad:\n[entity=sulfuric-acid-geyser] Väävelhappe geiser \n[entity=calcite] Kaltsiit \n[entity=tungsten-ore] Volframimaak
