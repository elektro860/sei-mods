fusion-reactor=Tihe plasmafookussüsteem võimaldab meil toota energiat otse tuumasünteesireaktsioonist, ilma et oleks vaja kasutada aurumasinaid.
fusion-reactor-equipment=Sisestatakse rüü sisse, et anda muule varustusele energiat.
