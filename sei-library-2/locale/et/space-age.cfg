toolbelt-equipment=Paigaldatakse rüüsse, et suurendada inventari mahtu.
tree-seeding=Kogu puude seemneid ja istuta need murule või mulda.
tungsten-carbide=Võimaldab valmistada volframkarbiidi – kõva ja kuumuskindlat keraamilist materjali. Volframimaaki leidub kergesti kättesaadavana mõnedes Vulcanuse pinnakivimites.
