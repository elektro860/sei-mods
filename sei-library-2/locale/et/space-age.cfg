rocket-silo=Kasutatakse esemete ja mängijate lennutamiseks kosmoseplatvormidele.
rocket-turret=Kauglaskevõimeline torn, mis tulistab rakette.
scrap-recycling-productivity=Jäätmete ringlussevõtust saadava saagise suurenemine.
space-platform=Töötle asteroidi tükke kasulikeks materjalideks.
space-platform-thruster=Võimaldab kosmoseplatvormidel liikuda teistele planeetidele.
space-science-pack-space-age=Kosmose teaduspaki tootmine kosmoseplatvormil.
stack-inserter=Virnsisestajad võimelised asetama esemeidkonveierlintidele mitmekihiliste virnadena, aga need ootavad enne liikumist, kuni käsi on täis.
steel-plate-productivity=Suurendab teras plaadi retsepti tootlikkust.
stellar-discovery-solar-system-edge=Ongi lõpp! Või siiski uus algus. Kosmoseplatvormi ehitamine, mis nõnda kaua vastu peab peale vaid hädaabimaanduse suhtelisele turvalisusele, tõestab sinu võimekust reisida ükskõik kuhu kaugematesse tähtedevahelise ruumi sügavustesse. Et kosmoseplatvorm selle reisi läbi elaks, peab see olema eriti iseseisev ja olema varustatud tööriistadega tee peal olevate suurte ja ohtlike asteroidide kasutatavateks ressurssideks muutmiseks.
