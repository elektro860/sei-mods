[space-location-description]
aquilo=Külmuv kõnnumaa ammonjaagi-ookeanide ja fluor-tuulutusega. Ehitised ja konveierid külmuvad, kui neid ei soojendata soojustoru või muu kuuma ehitisega.
fulgora=Kuiv, tuulepuhutud planeet, mille platoodel möllavad äikestormid ja kus on naftamered, mille üle saab ehitada kõrgel asuvaid raudteesildu.\nPaistab, et seal on mõned varemed.
shattered-planet=Salapärane jäänuk endisest maailmast kaugel tähtedevahelise kosmose sügavikes. Selle jäänukid, hõljumas alal mida see kord hõivas, hoiavad ressursse, mis avavad võimsaid tehnoloogiaid. Küll aga nende saamine on riskantne...
solar-system-edge=Ongi lõpp! Või siiski uus algus. Kosmoseplatvormi ehitamine, mis nõnda kaua vastu peab peale vaid hädaabimaanduse suhtelisele turvalisusele, tõestab sinu võimekust reisida ükskõik kuhu kaugematesse tähtedevahelise ruumi sügavustesse. Et kosmoseplatvorm selle reisi läbi elaks, peab see olema eriti iseseisev ja olema varustatud tööriistadega tee peal olevate suurte ja ohtlike asteroidide kasutatavateks ressurssideks muutmiseks.
vulcanus=Kuum vulkaaniline planeet, kus leidub mäekõrguseid vulkaane, laavajõgesid, tuha tasandikke ja väävelhappe geisreid. Rikas metallide poolest. Laava üle saab liikuda ainult kõrgel asuva raudtee kaudu.
