[factoriopedia-description]
fusion-generator=Tarbib plasmat tuumareaktorist elektrienergia loomiseks. Elektritootmine on nominaalne, kuid kõrgemate temperatuuride puhul kulutatakse vähem plasmat. Saadab väljundina kuumutatud jahutusvedelikku, mida saab jahutada krüogeenikajaamas, sama palju, kui tarbitud plasmat. Tuumageneraatoreid saab ühendada ja nad saavad teineteisele plasmat üle kanda.
fusion-reactor=Kasutab fluoroketooni jahutusvedelikku koos tuumasünteesi akudega, et toota ülikuumutatud plasma. Seda saab suunata otse ainult [entity=fusion-generator]i. Naabrusboonus teiste tuumasünteesireaktoritega suurendab oluliselt plasma temperatuuri, ilma et suureneks kasutatava jahutusvedeliku kogus.
[fluid-description]
fusion-plasma=[entity=fusion-reactor]is tekitatud ja [entity=fusion-generator] poolt tarbitavad ülikõrge temperatuuriga ioonid. See ei ole tavaline vedelik ega saa seda [entity=pipe]ka liigutada, seda saab liigutada ainult tuumasünteesireaktori ja tuumasünteesigeneraatori kaudu.\nPlasma temperatuur määrab selle energiaväärtuse.\nPlasma kogus vastab ka sellega kaasas liikuvale jahutusvedeliku kogusele, ning kuumutatud jahutusvedelik väljastatakse tuumasünteesigeneraatorist samal ajal, kui plasmat kasutatakse energia tootmiseks.
thruster-fuel=Tõukuri vedelkütus
