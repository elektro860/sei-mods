captivity=[item=rocket-launcher] välja tulistatud robotkapsel süstib spawnerisse annuse [item=bioflux]’i, millega see vangistatakse. Regulaarsete [item=bioflux]’i annustega jääb spawner vangistatuks.
carbon-fiber=Mõned taimed toodavad looduslikult süsiniknanotorusid, millest saab ketrada kiudu ja kududa äärmiselt tugevat kangast.
