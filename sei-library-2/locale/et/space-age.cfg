heating-tower=Toodab keemilistest kütustest soojust väga kõrge efektiivsusega. Ei lõpeta põlemist maksimaalsel temperatuuril. Juhib soojust ühendatud soojustorudesse, mida saab kasutada aurujõuks või külmumise vältimiseks.
holmium-processing=Võimaldab sul muuta holmiumi maaki holmiumi plaadiks.
jellynut=Jellystem annab želatiinset lägapähkli saaki. Istuta seemned lägapähkelite kasvupinnasele (kaardil magenta värviga märgitud).
landing-pad-unloading-bay=Sisestajad saavad eemaldada esemeid mahalaadimisplatvormilt, kui see on ühendatud lasti maandumisplatvormiga.
laser-weapons-damage=Suurendab laserkiirte kahju.
lightning-collector=Koguda välku laialt alalt ja toota elektrit tõhusamalt.
lithium-processing=Liitium on kergeim tahke element, väga kergestisüttiv ja raskesti hoiustav.
low-density-structure-productivity=Suurendab madala tihedusega struktuuri retsepti tootlikkust.
mech-armor=Ole üks masinaga.
metallurgic-science-pack=Võimaldab õppida metallurgia põhiteadmiste piire ületavaid teemasid.
overgrowth-soil=Tugevam pinnas, mis võimaldab taimi kasvatada kõikjal nende biomis.
planet-discovery-aquilo=Külmuv kõnnumaa põhjatute vedela ammoniaagi ookeanitega, mida ei saa maaks täita. Ohtlikud jäämäed on kõige sarnasemad asjad tahkele maapinnale ja neid saab laiendada hulpiva jääplatvormiga. Konstruktsioonid ja konveierid külmuvad, kui neid ei soojendata soojustoru või muu kuuma ehitisega, aga nad peab asetama betoonile, et see ei sulataks allolevat jääd.
planet-discovery-fulgora=Kuiv, tuulepuhutud planeet, mille platoodel möllavad äikestormid ja kus on naftamered, mille üle saab ehitada kõrgel asuvaid raudteesildu.\nPaistab, et seal on mõned varemed.
planet-discovery-vulcanus=Kuum vulkaaniline planeet, kus leidub mäekõrguseid vulkaane, laavajõgesid, tuha tasandikke ja väävelhappe geisreid. Rikas metallide poolest. Laava üle saab liikuda ainult kõrgel asuva raudtee kaudu.
plastic-bar-productivity=Suurendab plastmassi retsepti tootlikkust.
processing-unit-productivity=Suurendab töötlemisüksuse retsepti tootlikkust.
promethium-science-pack=Kasutatakse teadustöö tootlikkuse suurendamiseks, mis hõlbustab teiste täiustuste uurimist, mis omakorda lihtsustavad tulevasi ekspeditsioone purustatud planeedile.
quantum-processor=Protsessor, mis kasutab mitmeid kvantnähtusi erinevates rakendustes.
