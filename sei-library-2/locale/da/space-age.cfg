[space-location-description]
aquilo=En frossen ødemark med have med flydende ammoniak og fluorsprækker. Bygninger og transportbånd fryser, hvis de ikke opvarmes af tilstødende varmerør eller andre varme bygninger.
fulgora=En tør, vindomsust planet med tordenvejr og lynnedslag på plateauer, og oceaner af olie, der kan krydses med hævede togskinner.\nDet tyder på at der er nogle ruiner.
shattered-planet=En mystisk rest af en tidligere verden, dybt i det interstellare rum. Dens rester driver rundt som et knust minde, og indeholder ressourcer til at få adgang til mægtige teknologier. Men adgang til dem er ikke uden risiko...
solar-system-edge=Slut! Eller rettere, en ny begyndelse. Opbygning af en rumplatform, der er i stand til at overleve så langt væk fra den relative sikkerhed hvor dit rumskib styrtede ned, beviser din evne til at rejse hvor som helst i det store, interstellare rum. For at en rumplatform kan overleve denne tur, skal den være selvforsynende, og have de nødvendige redskaber til at forvandle store, ødelæggende asteroider til brugbare ressourcer.
[space-location-name]
aquilo=Aquilo
fulgora=Fulgora
shattered-planet=Den knuste planet
solar-system-edge=Kanten af solsystemet
[technology-description]
agricultural-science-pack=Mere avanceret landsbrugsanvendelse.
big-mining-drill=Et større og kraftigere minebor med et større mineområde. Giver mulighed for at mine hårdere malm, såsom de hårdere dele af wolframaflejringer.
biolab=Det tyder på at der er en metode til at dyrke æg til noget...
calcite-processing=Brug kalkspat til at få damp, vand og tung olie.
cryogenic-science-pack=Mere avanceret kryogen anvendelse.
electromagnetic-science-pack=Mere avanceret elektromagnetisk anvendelse.
foundation=Struktureret konstrueret fundament med varmeafskærmning og dybe skruepæle. Kan placeres på lava, oliehav og det meste vand.
health=Sund mad, sund krop.
heating-tower=Genererer varme fra kemiske brændstoffer med meget høj effektivitet. Afbrænding fortsætter selvom maksimal temperatur er opnået. Overfører varme til varmerør, der kan anvendes til dampkraft eller for at forhindre nedfrysning.
lithium-processing=Litium er det mindst tætte, faste element, meget brandfarligt, og svært at opbevare.
metallurgic-science-pack=Giver mulighed for forskning i avancerede former for metallurgi.
planet-discovery-aquilo=En frossen ødemark med bundløse have med flydende ammoniak, der ikke kan fyldes med jord. Usikre isflager er det tætteste på fast jord, og kan udvides med flydende isplatforme. Bygninger og transportbånd fryser, hvis de ikke opvarmes af tilstødende varmerør eller andre varme bygninger, og skal placeres på beton for ikke at smelte isen nedenunder.
planet-discovery-fulgora=En tør, vindomsust planet med tordenvejr og lynnedslag på plateauer, og oceaner af olie, der kan krydses med hævede togskinner.\nDet tyder på at der er nogle ruiner.
planet-discovery-gleba=En fugtig, sumpet planet med næringsrige moser. Vådområder kan bruges til landbrug, men er svært at bygge på. Vådområder kan fyldes op, men der er begrænset med sten.\nDe snoede bakker har sten og er bedre at bygge på, men kan ikke bruges til landbrug.
promethium-science-pack=Bruges til at forøge forskningsproduktivitet, hvilket gør det lettere at forske i andre opgraderinger, som gør fremtidige ekspeditioner til den knuste planet lettere.
rail-support-foundations=Tillader at bygge hævede togskinner på de dybe dele af oliehavet på [planet=fulgora].
railgun=En elektrisk drevet krydsning mellem en kanon og en snigskytteriffel.
railgun-damage=Gør railgun projektiler tættere og mere robuste, som resulterer i mere skade.
railgun-shooting-speed=Forbedrede kølesystemer betyder at en railgun kan skyde oftere.
rocket-turret=En langtrækkende tårn, der affyrer raketter.
space-platform=Forarbejd asteroidefragmenter til nyttige materialer.
space-platform-thruster=Giver rumplatforme mulighed for at rejse til andre planeter.
space-science-pack-space-age=Produktion af [item=space-science-pack] på en rumplatform.
tesla-weapons=Våben der giver elektrisk skade, og kan hoppe mellem fjender.
tungsten-steel=Tillader dig at lave wolfram-stålplade.
turbo-transport-belt=Endnu hurtigere transportbånd.
