[tips-and-tricks-item-description]
aquilo-briefing=[planet=aquilo] er en frossen ødemark med have med ammoniakvand. Det er den fjerneste planet, hvor brugen af [entity=solar-panel] praktisk talt er umuligt.\n[entity=logistic-robot] og [entity=construction-robot] er meget svagere her.\nDen eneste genkendelige ressource her er [entity=crude-oil], så fabrikken er afhængig af interplanetarisk logistik. Spilleren kan strande her uden tilstrækkelig støtte fra andre planeter!\nOverfladen er ganske lille, og det er nødvendigt at udvide den. Havet kan fyldes med [item=ice-platform] så man kan gå på den. [item=concrete] bruges som fundament for bygninger, og beskytter isen mod at smelte.\nEnheder skal opvarmes for at fungere ved hjælp af [entity=heating-tower] og [entity=heat-pipe].
asteroid-defense=[entity=gun-turret] kan bruges til at nedbryde større asteroider til asteroidefragmenter. Disse kan opsamles af [entity=asteroid-collector] og forarbejdes på platformen for ressourcer. Større asteroider vil skade platformen ved sammenstød.
fulgora-briefing=[planet=fulgora] er en tør og gold planet uden tegn på liv, og med farlig lynaktivitet i de hyppige natcyklusser.\n[entity=solar-panel] er meget mindre effektiv, men lyn kan indfanges med [entity=lightning-rod] og gemmes i [entity=accumulator].\nDer findes ingen naturlige ressourcer noget sted på planeten. De eneste tilgængelige ting er rester i form af [entity=scrap].\nHvad der kunne have været oceaner, er nu fuld af [fluid=heavy-oil] , der kan pumpes op med [entity=offshore-pump].\n[tile=oil-ocean-shallow] kan ikke jordfyldes før meget senere, men det kan krydses af hævede togskinner. Bygning af [entity=rail-support] på de dybe dele af havet vil kræve yderligere forskning.
heating-mechanics=[entity=heating-tower] kan generere varme fra brændstof, og stopper ikke med at brænde ved maksimal temperatur.\nDet bruger [entity=heat-pipe] til at overføre varme til andre enheder.\nHver enhed skal røre ved en varmekilde for ikke at fryse.\nElmaster, [entity=solar-panel] og [entity=accumulator] er undtaget.
production-entity-list=[entity=electric-mining-drill] Elektrisk minebor \n[entity=big-mining-drill] Stort minebor \n[entity=pumpjack] Oliepumpe \n[entity=assembling-machine-2] Fremstillingsmaskine 2 \n[entity=assembling-machine-3] Fremstillingsmaskine 3 \n[entity=electric-furnace] Elektrisk ovn \n[entity=recycler] Genvindingsanlæg \n[entity=chemical-plant] Kemikaliefabrik \n[entity=centrifuge] Centrifuge \n[entity=crusher] Knusemaskine \n[entity=foundry] Støberi \n[entity=agricultural-tower] Landbrugstårn \n[entity=electromagnetic-plant] Elektromagnetisk anlæg \n[entity=cryogenic-plant] Kryogenanlæg
